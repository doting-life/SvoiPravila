services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: svoi_pravila
      POSTGRES_USER: svoi_pravila
      POSTGRES_PASSWORD: svoi_pravila
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svoi_pravila -d svoi_pravila"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://svoi_pravila:svoi_pravila@postgres:5432/svoi_pravila
      REDIS_URL: redis://redis:6379/0
      MINIAPP_STATIC_DIR: /app/frontend/dist
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
