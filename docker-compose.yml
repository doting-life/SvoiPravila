services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: svoi_pravila
      POSTGRES_USER: svoi_pravila
      POSTGRES_PASSWORD: svoi_pravila
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svoi_pravila -d svoi_pravila"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot, non-destructive schema initialization (SQLAlchemy create_all only
  # creates missing tables; it never drops data). Runs before every app start.
  db-init:
    build: .
    image: svoi-pravila-app:local
    command: ["python", "scripts/init_db.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://svoi_pravila:svoi_pravila@postgres:5432/svoi_pravila
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: svoi-pravila-app:local
    env_file:
      - .env
    environment:
      RELATIONSHIP_BACKEND: postgres
      DATABASE_URL: postgresql+asyncpg://svoi_pravila:svoi_pravila@postgres:5432/svoi_pravila
      CHECKPOINT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      MINIAPP_STATIC_DIR: /app/frontend/dist
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
